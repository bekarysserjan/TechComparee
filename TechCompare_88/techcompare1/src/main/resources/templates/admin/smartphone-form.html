<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smartphone form · TechCompare</title><link rel="stylesheet" href="/admin.css"></head>
<body><header><a class="brand" href="/admin">TechCompare <span>ADMIN</span></a><form th:action="@{/logout}" method="post"><button class="ghost">Log out</button></form></header>
<main><a class="back" href="/admin/smartphones">← Back to smartphones</a><p class="eyebrow">DEVICE RECORD</p><h1 th:text="${formTitle}">Smartphone form</h1>
<p class="muted">Device name and brand are required. Leave optional characteristics blank if unknown.</p>
<form class="edit-form" th:object="${device}" th:action="${formAction}" method="post"><div class="form-grid"><label>Device name<input type="text" th:field="*{name}" required></label><label>Brand<input type="text" th:field="*{brand}" required></label><label>Image URL<input type="url" th:field="*{imageUrl}"></label><label>Geekbench multi-core<input type="number" th:field="*{geekbenchMulti}"></label><label>Geekbench single-core<input type="number" th:field="*{geekbenchSingle}"></label><label>AnTuTu GPU score<input type="number" th:field="*{antutuGpuScore}"></label><label>RAM (GB)<input type="number" th:field="*{ramGb}"></label><label>Storage (GB)<input type="number" th:field="*{storageGb}"></label><label>Battery (mAh)<input type="number" th:field="*{batteryMah}"></label><label>Main camera (MP)<input type="number" th:field="*{mainCameraMp}"></label><label>Telephoto lens (0/1)<input type="number" th:field="*{hasTelephotoLens}"></label><label>Maximum video FPS<input type="number" th:field="*{videoMaxFps}"></label><label>Front camera (MP)<input type="number" th:field="*{frontCameraMp}"></label><label>Screen refresh rate (Hz)<input type="number" th:field="*{screenRefreshHz}"></label><label>Screen brightness (nits)<input type="number" th:field="*{screenBrightnessNits}"></label><label>Weight (g)<input type="number" th:field="*{weightG}"></label><label>5G support<select th:field="*{has5g}"><option value="">Not specified</option><option value="true">Yes</option><option value="false">No</option></select></label></div>
<div class="form-actions"><button class="button" type="submit">Save device</button><a class="button secondary" href="/admin/smartphones">Cancel</a></div></form></main></body></html>

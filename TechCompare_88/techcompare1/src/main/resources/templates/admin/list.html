<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Device management · TechCompare</title><link rel="stylesheet" href="/admin.css"></head>
<body><header><a class="brand" href="/admin">TechCompare <span>ADMIN</span></a><form th:action="@{/logout}" method="post"><button class="ghost">Log out</button></form></header>
<main><a class="back" href="/admin">← Dashboard</a><div class="page-heading"><div><p class="eyebrow">DATABASE MANAGEMENT</p><h1 th:text="${deviceType == 'smartphone' ? 'Smartphones' : 'Laptops'}">Devices</h1><p class="muted">Review, edit, add, or remove database records.</p></div><a class="button" th:href="${deviceType == 'smartphone' ? '/admin/smartphones/new' : '/admin/laptops/new'}">+ Add device</a></div>
<div class="notice" th:if="${message}" th:text="${message}"></div><input id="search" class="search" type="search" placeholder="Search by device name or brand…" oninput="filterRows()">
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Device</th><th>Brand</th><th>RAM</th><th>Storage</th><th>Actions</th></tr></thead><tbody id="deviceRows">
<tr th:each="device : ${devices}"><td th:text="${device.id}">1</td><td class="device-name" th:text="${device.name}">Device name</td><td th:text="${device.brand}">Brand</td><td th:text="${device.ramGb != null ? device.ramGb + ' GB' : '—'}">8 GB</td><td th:text="${device.storageGb != null ? device.storageGb + ' GB' : '—'}">256 GB</td><td><div class="row-actions"><a class="small-button" th:href="${deviceType == 'smartphone' ? '/admin/smartphones/' + device.id + '/edit' : '/admin/laptops/' + device.id + '/edit'}">Edit</a><form th:action="${deviceType == 'smartphone' ? '/admin/smartphones/' + device.id + '/delete' : '/admin/laptops/' + device.id + '/delete'}" method="post" onsubmit="return confirm('Delete this device permanently?')"><button class="small-button danger">Delete</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(devices)}"><td colspan="6" class="empty">No devices found. Add your first record.</td></tr></tbody></table></div><p class="footnote">Search filters the currently loaded records. Deletion is permanent.</p></main>
<script>function filterRows(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#deviceRows tr').forEach(r=>{r.hidden=!r.innerText.toLowerCase().includes(q)})}</script></body></html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laptop form · TechCompare</title><link rel="stylesheet" href="/admin.css"></head>
<body><header><a class="brand" href="/admin">TechCompare <span>ADMIN</span></a><form th:action="@{/logout}" method="post"><button class="ghost">Log out</button></form></header>
<main><a class="back" href="/admin/laptops">← Back to laptops</a><p class="eyebrow">DEVICE RECORD</p><h1 th:text="${formTitle}">Laptop form</h1>
<p class="muted">Device name and brand are required. Leave optional characteristics blank if unknown.</p>
<form class="edit-form" th:object="${device}" th:action="${formAction}" method="post"><div class="form-grid"><label>Device name<input type="text" th:field="*{name}" required></label><label>Brand<input type="text" th:field="*{brand}" required></label><label>Image URL<input type="url" th:field="*{imageUrl}"></label><label>Geekbench multi-core<input type="number" th:field="*{geekbenchMulti}"></label><label>Geekbench single-core<input type="number" th:field="*{geekbenchSingle}"></label><label>GPU benchmark score<input type="number" th:field="*{gpuBenchmarkScore}"></label><label>RAM (GB)<input type="number" th:field="*{ramGb}"></label><label>Storage (GB)<input type="number" th:field="*{storageGb}"></label><label>Screen resolution (pixels)<input type="number" th:field="*{screenResolutionPixels}"></label><label>Screen size (inches)<input type="number" th:field="*{screenSizeInch}" step="0.1"></label><label>Panel type<input type="text" th:field="*{panelType}"></label><label>Touchscreen<select th:field="*{hasTouchscreen}"><option value="">Not specified</option><option value="true">Yes</option><option value="false">No</option></select></label><label>Weight (kg)<input type="number" th:field="*{weightKg}" step="0.01"></label><label>Battery life (hours)<input type="number" th:field="*{batteryLifeHours}"></label></div>
<div class="form-actions"><button class="button" type="submit">Save device</button><a class="button secondary" href="/admin/laptops">Cancel</a></div></form></main></body></html>
